name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - "starter/frontend/**"
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18.14"
          cache: "npm"
          cache-dependency-path: "starter/frontend/package-lock.json"
      - run: npm ci
      - run: npm run lint
      - run: CI=true npm test -- --watchAll=false
